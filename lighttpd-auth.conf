# HTTP Basic Authentication for Camera Monitor
# File: /etc/lighttpd/conf-available/20-auth.conf
#
# Enable with: sudo lighty-enable-mod auth
# Then: sudo systemctl restart lighttpd

server.modules += ("mod_auth", "mod_authn_file")

auth.backend = "plain"
auth.backend.plain.userfile = "/etc/lighttpd/.htpasswd"

# Protect camera panel and stats API
auth.require = (
    "/camera.html" => (
        "method" => "basic",
        "realm" => "Camera Monitor",
        "require" => "valid-user"
    ),
    "/stats.php" => (
        "method" => "basic",
        "realm" => "Camera Monitor",
        "require" => "valid-user"
    )
)
