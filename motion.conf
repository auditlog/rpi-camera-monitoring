# Motion configuration for Raspberry Pi Camera Module v3
# Hostname: rpi4las
# Camera: IMX708 (4608x2592)
# 
# File: /etc/motion/motion.conf

# === Podstawowe ===
daemon off
setup_mode off
log_level 6

# === Urządzenie kamery ===
video_device /dev/video0

# === Rozdzielczość i FPS ===
# 16:9 dla pełnego FOV Camera Module v3
# Dostępne tryby: 1536x864, 2304x1296, 4608x2592
width 2304
height 1296
framerate 25

# === Overlay tekstu ===
# Skala 1-10 (domyślnie 1)
text_scale 3
text_left %Y-%m-%d %T\nHost: %{host}
text_right FPS: %{fps}\nMotion: %q

# === Detekcja ruchu ===
emulate_motion off
threshold 1000
despeckle_filter EedDl
minimum_motion_frames 1
event_gap 60
pre_capture 3
post_capture 0

# === Zdjęcia ===
picture_output off
picture_filename %Y%m%d%H%M%S-%q

# === Nagrywanie wideo ===
movie_output on
movie_max_time 60
movie_quality 75
# Sprzętowe kodowanie H264 na RPi
movie_codec h264_v4l2m2m
movie_filename %t-%v-%Y%m%d%H%M%S

# === Streaming ===
stream_quality 50
stream_maxrate 25
stream_port 8081
# off = dostęp z sieci, on = tylko localhost
stream_localhost off

# === Webcontrol ===
webcontrol_port 8080
webcontrol_localhost off
webcontrol_parms 0

# === Katalog nagrań ===
# Upewnij się: sudo chown motion:motion /var/lib/motion
target_dir /var/lib/motion
